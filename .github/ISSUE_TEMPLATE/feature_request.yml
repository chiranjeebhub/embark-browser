name: Feature request
description: Suggest an idea or a change in behavior
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem or workflow, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How should it work?
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: How Arc or another browser handles it, mockups, links.
