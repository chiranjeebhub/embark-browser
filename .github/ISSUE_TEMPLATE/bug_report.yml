name: Bug report
description: Something in Embark doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Engine
      options:
        - Chromium (EmbarkChromium)
        - WebKit (Embark)
        - Not sure
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: macOS version and commit
      placeholder: macOS 26.1, main at abc1234
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
