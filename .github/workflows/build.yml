name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Pull requests from forks run with a read-only token and no secrets.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS app (WebKit engine)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project Embark.xcodeproj \
            -scheme Embark \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Test
        run: |
          set -o pipefail
          xcodebuild \
            -project Embark.xcodeproj \
            -scheme EmbarkTests \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee test.log | tail -40

      - name: Summarize build
        if: always()
        run: scripts/ci-summarize.sh build.log WebKit

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-log-webkit
          path: |
            build.log
            test.log

  chromium:
    name: macOS app (Chromium engine)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Download and build CEF
        run: |
          set -o pipefail
          command -v cmake >/dev/null || brew install cmake
          scripts/fetch-cef.sh 2>&1 | tee cef.log
          echo "::notice title=CEF::$(grep -m1 '^Downloading' cef.log)"

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project Embark.xcodeproj \
            -scheme EmbarkChromium \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Check app bundle
        run: |
          APP="$(find ~/Library/Developer/Xcode/DerivedData -path '*Debug-chromium/Embark.app' -maxdepth 6 | head -1)"
          echo "::notice title=Chromium bundle::$(ls "$APP/Contents/Frameworks" | tr '\n' ', ')"

      - name: Summarize build
        if: always()
        run: |
          if [ -f cef.log ] && ! grep -q '^Done. CEF is in' cef.log; then
            tail -25 cef.log | while IFS= read -r l; do echo "::error title=CEF setup::$l"; done
          fi
          scripts/ci-summarize.sh build.log Chromium

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-log-chromium
          path: |
            build.log
            cef.log
