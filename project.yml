# Generate the Xcode project with: xcodegen generate
#
# Targets:
#   Embark          WebKit development engine. Builds with no downloads.
#   EmbarkChromium  Chromium engine via CEF. Run scripts/fetch-cef.sh first.
#   EmbarkHelper    Chromium's helper process, embedded into EmbarkChromium.
name: Embark
options:
  bundleIdPrefix: dev.embark
  deploymentTarget:
    macOS: "26.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    CLANG_ENABLE_OBJC_ARC: YES
    # Automatic updates. The appcast is published with each GitHub release
    # (.github/workflows/release.yml). The public key is the one scripts/setup-updates.sh
    # prints; while it's empty, the updater stays off.
    SPARKLE_FEED_URL: https://github.com/chiranjeebhub/embark-browser/releases/latest/download/appcast.xml
    SPARKLE_PUBLIC_KEY: "d9qwOK7/PjRt6MvfSb3Y4N1A517HdHxTOkfSdQwKTUg="
targets:
  Embark:
    type: application
    platform: macOS
    sources:
      - path: Embark
        excludes:
          - "Engine/CEF/**"
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.embark.browser
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Embark/App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Embark
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSCameraUsageDescription: Websites you allow can use your camera.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Websites you allow can use your microphone.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ENGINE_WEBKIT"

  EmbarkChromium:
    type: application
    platform: macOS
    sources:
      - path: Embark
        excludes:
          - "Engine/CEF/HelperMain.mm"
    dependencies:
      - target: EmbarkHelper
        embed: false
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: Embark
        PRODUCT_BUNDLE_IDENTIFIER: dev.embark.browser
        # Separate output folder so this app doesn't overwrite the WebKit build of the same name.
        CONFIGURATION_BUILD_DIR: "$(BUILD_DIR)/$(CONFIGURATION)-chromium"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Embark/App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Embark
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSCameraUsageDescription: Websites you allow can use your camera.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Websites you allow can use your microphone.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ENGINE_CEF"
        SWIFT_OBJC_BRIDGING_HEADER: Embark/Engine/CEF/Embark-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Vendor/cef"
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/Vendor/cef/build/libcef_dll_wrapper"
        OTHER_LDFLAGS: "-lcef_dll_wrapper"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Embed Chromium and helpers
        script: '"$SRCROOT/scripts/embed-cef.sh"'
        basedOnDependencyAnalysis: false

  EmbarkHelper:
    type: application
    platform: macOS
    sources:
      - path: Embark/Engine/CEF/HelperMain.mm
    settings:
      base:
        PRODUCT_NAME: Embark Helper
        PRODUCT_BUNDLE_IDENTIFIER: dev.embark.browser.helper
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Vendor/cef"
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/Vendor/cef/build/libcef_dll_wrapper"
        OTHER_LDFLAGS: "-lcef_dll_wrapper"

  # Unit tests for model logic. Builds only the model files, so it needs no app host and never
  # touches the app's saved state. Run: xcodebuild test -scheme EmbarkTests
  EmbarkTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Embark/Models
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.embark.tests
        GENERATE_INFOPLIST_FILE: YES
